<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">FITLY 개발 아키텍처</title>
  <desc id="desc">Vue 프론트엔드, Spring Boot 백엔드, Supabase 데이터베이스와 스토리지, AI Provider, GitHub CI와 Render CD 관계도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#6d5ce7"/>
    </marker>
    <style>
      .title { font: 700 40px Arial, "Noto Sans KR", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 19px Arial, "Noto Sans KR", sans-serif; fill: #64748b; }
      .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 24; filter: url(#shadow); }
      .group-label { font: 700 17px Arial, "Noto Sans KR", sans-serif; fill: #475569; letter-spacing: 1px; }
      .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 16; }
      .node-purple { fill: #f3f0ff; stroke: #6d5ce7; stroke-width: 2.5; rx: 16; }
      .node-green { fill: #ecfdf5; stroke: #10b981; stroke-width: 2.5; rx: 16; }
      .node-orange { fill: #fff7ed; stroke: #f97316; stroke-width: 2.5; rx: 16; }
      .node-blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2.5; rx: 16; }
      .node-title { font: 700 22px Arial, "Noto Sans KR", sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-text { font: 400 16px Arial, "Noto Sans KR", sans-serif; fill: #475569; text-anchor: middle; }
      .label { font: 600 15px Arial, "Noto Sans KR", sans-serif; fill: #475569; text-anchor: middle; }
      .flow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .flow-purple { fill: none; stroke: #6d5ce7; stroke-width: 3; marker-end: url(#arrowPurple); }
      .flow-dash { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow); }
      .small { font: 400 14px Arial, "Noto Sans KR", sans-serif; fill: #64748b; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="80" class="title">FITLY Development Architecture</text>
  <text x="80" y="116" class="subtitle">AI 코디 추천부터 단건 의류 대여까지 - 기능 중심 모듈과 교체 가능한 AI 구조</text>

  <!-- Actors -->
  <rect x="70" y="205" width="220" height="500" class="group"/>
  <text x="100" y="245" class="group-label">CLIENT</text>
  <circle cx="180" cy="345" r="58" fill="#ede9fe" stroke="#6d5ce7" stroke-width="2.5"/>
  <circle cx="180" cy="326" r="16" fill="#6d5ce7"/>
  <path d="M145 376 Q180 345 215 376" fill="none" stroke="#6d5ce7" stroke-width="12" stroke-linecap="round"/>
  <text x="180" y="430" class="node-title">사용자</text>
  <text x="180" y="458" class="node-text">코디 추천 · 의류 대여</text>
  <circle cx="180" cy="560" r="50" fill="#e0f2fe" stroke="#3b82f6" stroke-width="2.5"/>
  <path d="M155 560 h50 M180 535 v50" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <text x="180" y="640" class="node-title">관리자</text>
  <text x="180" y="668" class="node-text">상품 · 재고 · 주문 관리</text>

  <!-- Render -->
  <rect x="375" y="160" width="650" height="665" class="group"/>
  <text x="405" y="202" class="group-label">RENDER · DOCKER WEB SERVICE</text>

  <rect x="435" y="245" width="530" height="120" class="node-purple"/>
  <text x="700" y="290" class="node-title">Vue 3 + Vite</text>
  <text x="700" y="320" class="node-text">TPO 입력 · 이미지 미리보기 · 추천 결과 · 대여 UI</text>
  <text x="700" y="345" class="small">기능별 features / pages / shared 구조</text>

  <path d="M700 365 L700 415" class="flow-purple"/>
  <text x="790" y="398" class="label">REST API · JSON</text>

  <rect x="435" y="425" width="530" height="320" class="node-blue"/>
  <text x="700" y="470" class="node-title">Spring Boot API</text>
  <text x="700" y="500" class="node-text">기능 중심 패키지 + 기능 내부 계층 분리</text>

  <rect x="470" y="535" width="215" height="70" class="node"/>
  <text x="577" y="565" class="node-title">Wardrobe</text>
  <text x="577" y="589" class="small">보유 의류 · 이미지</text>
  <rect x="715" y="535" width="215" height="70" class="node"/>
  <text x="822" y="565" class="node-title">Recommendation</text>
  <text x="822" y="589" class="small">비동기 AI 추천 Job</text>
  <rect x="470" y="630" width="215" height="70" class="node"/>
  <text x="577" y="660" class="node-title">Catalog</text>
  <text x="577" y="684" class="small">상품 · 가격 · 재고</text>
  <rect x="715" y="630" width="215" height="70" class="node"/>
  <text x="822" y="660" class="node-title">Rental</text>
  <text x="822" y="684" class="small">대여 주문 · 반납</text>
  <text x="700" y="730" class="small">OpenAPI / Swagger UI · Validation · Exception · Actuator</text>

  <!-- External services -->
  <rect x="1110" y="205" width="420" height="500" class="group"/>
  <text x="1140" y="245" class="group-label">MANAGED SERVICES</text>

  <rect x="1170" y="285" width="300" height="110" class="node-green"/>
  <text x="1320" y="330" class="node-title">Supabase PostgreSQL</text>
  <text x="1320" y="360" class="node-text">사용자 · 추천 · 상품 · 재고 · 주문</text>

  <rect x="1170" y="430" width="300" height="100" class="node-green"/>
  <text x="1320" y="472" class="node-title">Supabase Storage</text>
  <text x="1320" y="502" class="node-text">보유 의류 · 상품 이미지</text>

  <rect x="1170" y="565" width="300" height="100" class="node-orange"/>
  <text x="1320" y="607" class="node-title">AI Provider</text>
  <text x="1320" y="637" class="node-text">Mock → Vision / LLM API</text>

  <!-- Runtime flows -->
  <path d="M290 455 C330 455 335 305 435 305" class="flow"/>
  <text x="355" y="350" class="label">HTTPS</text>
  <path d="M965 550 C1050 550 1080 340 1170 340" class="flow"/>
  <text x="1070" y="398" class="label">JPA/JDBC</text>
  <path d="M965 585 C1070 585 1080 480 1170 480" class="flow"/>
  <text x="1065" y="530" class="label">파일 API</text>
  <path d="M965 620 C1050 620 1080 615 1170 615" class="flow-dash"/>
  <text x="1065" y="600" class="label">AiProvider</text>

  <!-- Core service flow -->
  <rect x="70" y="885" width="1460" height="345" class="group"/>
  <text x="105" y="930" class="group-label">CORE SERVICE FLOW · ASYNCHRONOUS RECOMMENDATION</text>
  <rect x="115" y="985" width="220" height="120" class="node-purple"/>
  <text x="225" y="1030" class="node-title">1. 조건 입력</text>
  <text x="225" y="1060" class="node-text">TPO · 스타일 · 사진</text>
  <path d="M335 1045 L440 1045" class="flow-purple"/>
  <rect x="440" y="985" width="220" height="120" class="node-blue"/>
  <text x="550" y="1030" class="node-title">2. Job 생성</text>
  <text x="550" y="1060" class="node-text">202 · PENDING</text>
  <path d="M660 1045 L765 1045" class="flow-purple"/>
  <rect x="765" y="985" width="220" height="120" class="node-orange"/>
  <text x="875" y="1030" class="node-title">3. AI 분석</text>
  <text x="875" y="1060" class="node-text">Mock → Vision / LLM</text>
  <path d="M985 1045 L1090 1045" class="flow-purple"/>
  <rect x="1090" y="985" width="220" height="120" class="node-green"/>
  <text x="1200" y="1030" class="node-title">4. 결과 저장</text>
  <text x="1200" y="1060" class="node-text">COMPLETED · 추천 DTO</text>
  <path d="M1310 1045 L1415 1045" class="flow-purple"/>
  <rect x="1330" y="985" width="150" height="120" class="node"/>
  <text x="1405" y="1030" class="node-title">5. 대여</text>
  <text x="1405" y="1060" class="small">주문 · 재고 차감</text>
  <text x="800" y="1165" class="node-text">Frontend는 jobId로 상태를 Polling하며 AI Provider의 종류를 알지 못한다.</text>

  <!-- Delivery -->
  <rect x="70" y="1320" width="1460" height="165" class="group"/>
  <text x="105" y="1360" class="group-label">DELIVERY PIPELINE</text>
  <text x="320" y="1425" class="node-title">GitHub main</text>
  <path d="M440 1415 L650 1415" class="flow"/>
  <text x="545" y="1395" class="small">push / Pull Request</text>
  <text x="790" y="1425" class="node-title">Actions CI</text>
  <path d="M900 1415 L1110 1415" class="flow"/>
  <text x="1005" y="1395" class="small">checks pass</text>
  <text x="1300" y="1425" class="node-title">Render Auto-Deploy</text>

</svg>
