spring:
  profiles:
    default: local
  ai:
    model:
      chat: ${FITLY_AI_PROVIDER:mock}
    openai:
      api-key: ${OPENAI_API_KEY:missing}
      chat:
        options:
          model: ${FITLY_AI_MODEL:gpt-4o-mini}
          temperature: ${FITLY_AI_TEMPERATURE:0.2}
    retry:
      max-attempts: 1
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
server:
  port: ${PORT:8080}
  error:
    include-message: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
fitly:
  ai:
    provider: ${FITLY_AI_PROVIDER:mock}
    vision-provider: ${FITLY_VISION_PROVIDER:mock}
    model: ${FITLY_AI_MODEL:gpt-4o-mini}
    max-candidates: ${FITLY_AI_MAX_CANDIDATES:5}
