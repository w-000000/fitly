services:
  - type: web
    name: fitly
    branch: main
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: supabase
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USERNAME
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JPA_DDL_AUTO
        value: validate
      - key: JPA_DEFAULT_SCHEMA
        value: public
      - key: DB_MAX_POOL_SIZE
        value: "5"
      - key: DB_MIN_IDLE
        value: "1"
      - key: FITLY_AI_PROVIDER
        value: mock
      - key: FITLY_AI_MODEL
        value: gpt-4o-mini
      - key: FITLY_AI_TEMPERATURE
        value: "0.2"
      - key: OPENAI_API_KEY
        sync: false
